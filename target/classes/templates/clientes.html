<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Registro de Clientes</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
      <a class="navbar-brand" th:href="@{/}">Menú</a>
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/marcas}">Marcas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/productos}">Productos</a>
        </li>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

        <h1>Registro de Clientes</h1>
        <p th:if="${error}" th:text="${error}" style="color:red;"></p>

        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">    
            <input type="hidden" th:field="*{id_cliente}" />
            
            <label for="nit">NIT:</label>
            <input type="text" th:field="*{nit}" id="nit">
            
            <label for="nombre">Nombre:</label>
            <input type="text" th:field="*{nombre}" id="nombre">
            
            <label for="apellidos">Apellidos:</label>
            <input type="text" th:field="*{apellidos}" id="apellidos">
            
            <label for="email">Email:</label>
            <input type="email" th:field="*{email}" id="email">    
            
            <button type="submit">Guardar</button>
        </form>

        <br>

        <table class="table table-striped-columns">
            <thead>
                <tr>
                    <th>NIT</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.nit}"></td>
                    <td th:text="${c.nombre}"></td>
                    <td th:text="${c.apellidos}"></td>
                    <td th:text="${c.email}"></td>
                    <td>
                        <a th:href="@{/clientes/editar/{id}(id=${c.id_cliente})}">Editar</a>
                        <form th:action="@{/clientes/eliminar/{id}(id=${c.id_cliente})}" method="post" style="display:inline">
                            <button type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>

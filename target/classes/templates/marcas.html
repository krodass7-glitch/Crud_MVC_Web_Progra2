<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Registro de Marcas</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">Menú</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/marcas}">Marcas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/productos}">Productos</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Search"/>
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>
                </div>
            </div>
        </nav>

        <div class="container">
            <h1 class="mb-4">Registro de Marcas</h1>
            
            <!-- Mensajes de Estado -->
            <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
            <p th:if="${exito}" th:text="${exito}" class="alert alert-success"></p>

            <!-- Formulario Responsivo -->
            <form th:action="@{/marcas/guardar}" th:object="${marca}" method="post" class="card card-body shadow-sm mb-4">    
                <input type="hidden" th:field="*{id_marca}" />
                
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-8 col-lg-9">
                        <label for="nombre_marca" class="form-label fw-bold">Nombre de Marca:</label>
                        <input type="text" th:field="*{nombre_marca}" id="nombre_marca" class="form-control" placeholder="Ingrese nombre de la marca" required>
                    </div>

                    <div class="col-12 col-md-4 col-lg-3 text-end">
                        <button type="submit" class="btn btn-primary w-100">
                            Guardar Marca
                        </button>
                    </div>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre de Marca</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${marcas}">
                            <td th:text="${m.id_marca}"></td>
                            <td th:text="${m.nombre_marca}"></td>
                            <td class="text-center">
                                <a th:href="@{/marcas/editar/{id}(id=${m.id_marca})}" class="btn btn-sm btn-warning">Editar</a>
                                <form th:action="@{/marcas/eliminar/{id}(id=${m.id_marca})}" method="post" style="display:inline">
                                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>    
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
